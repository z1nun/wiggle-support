<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>위글 (Wiggle) - 다운로드</title>
  <meta property="og:title" content="위글 (Wiggle) - 강아지 산책 친구">
  <meta property="og:description" content="강아지 친구와 함께 산책해요">
  <!-- og:image는 공개 호스팅이어야 함. wiggle 레포는 PRIVATE이라 raw.githubusercontent 404 → wiggle-support 자체 호스팅으로 교체. -->
  <meta property="og:image" content="https://z1nun.github.io/wiggle-support/wiggle-share-card.png">
  <meta property="og:image:width" content="800">
  <meta property="og:image:height" content="400">
  <script>
    (function () {
      var IOS_URL = 'https://apps.apple.com/app/id6761043013';
      var ANDROID_URL = 'https://play.google.com/store/apps/details?id=com.kangjinwon.wiggle';
      var ua = navigator.userAgent || '';
      var isAndroid = /android/i.test(ua);
      // iPad 13+ 는 데스크탑 UA 흉내내므로 Mac + touch 도 함께 체크.
      var isIOS = /iPhone|iPad|iPod/.test(ua) ||
                  (/Mac/.test(ua) && typeof navigator.maxTouchPoints === 'number' && navigator.maxTouchPoints > 1);
      if (isAndroid) {
        location.replace(ANDROID_URL);
      } else if (isIOS) {
        location.replace(IOS_URL);
      }
      // 데스크탑/그 외 → 아래 본문 표시 (수동 선택 가능).
    })();
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #333; background: #fff; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 80px 24px 60px; text-align: center; }
    .logo { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 24px; }
    h1 { font-size: 28px; font-weight: 800; color: #1a1a1a; margin-bottom: 8px; }
    h1 span { color: #FF6B35; }
    .tagline { font-size: 16px; color: #666; line-height: 1.5; margin-bottom: 32px; }
    .stores { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }
    .store-btn { display: block; padding: 16px 24px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 15px; transition: opacity 0.15s; }
    .store-btn:hover { opacity: 0.85; }
    .store-ios { background: #1a1a1a; color: #fff; }
    .store-android { background: #FF6B35; color: #fff; }
    .note { font-size: 13px; color: #999; line-height: 1.6; }
    .footer { text-align: center; padding: 40px 20px; border-top: 1px solid #eee; }
    .footer p { font-size: 13px; color: #999; margin-bottom: 8px; }
    .footer a { color: #FF6B35; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="https://raw.githubusercontent.com/z1nun/wiggle/main/wiggle-app/assets/icon.png" alt="위글 앱 아이콘" class="logo">
    <h1>🐾 <span>위글</span> 다운로드</h1>
    <p class="tagline">강아지 친구와 함께<br>산책을 시작해보세요</p>
    <div class="stores">
      <a href="https://apps.apple.com/app/id6761043013" class="store-btn store-ios">📱 App Store에서 받기 (iOS)</a>
      <a href="https://play.google.com/store/apps/details?id=com.kangjinwon.wiggle" class="store-btn store-android">🤖 Play Store에서 받기 (Android)</a>
    </div>
    <p class="note">모바일에서 열면 자동으로<br>해당 스토어로 이동합니다.</p>
  </div>

  <div class="footer">
    <p>위글 (Wiggle) &copy; 2026 jinwon kang</p>
    <p><a href="index.html">홈</a> · <a href="privacy-policy.html">개인정보처리방침</a> · <a href="terms.html">이용약관</a></p>
  </div>
</body>
</html>
